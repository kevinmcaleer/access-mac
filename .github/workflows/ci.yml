name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-linux:
    name: Engine tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - name: swift test
        run: mkdir -p /tmp/edits && swift test
        env:
          ACCESS_EDIT_OUTPUT: /tmp/edits
      - name: Check edited databases with Jackcess
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends openjdk-21-jdk-headless curl > /dev/null
          mkdir -p /tmp/jars
          for jar in com/healthmarketscience/jackcess/jackcess/4.0.5/jackcess-4.0.5.jar \
                     org/apache/commons/commons-lang3/3.14.0/commons-lang3-3.14.0.jar \
                     commons-logging/commons-logging/1.3.0/commons-logging-1.3.0.jar; do
            curl -fsSL -o "/tmp/jars/$(basename "$jar")" "https://repo1.maven.org/maven2/$jar"
          done
          java -cp "/tmp/jars/*" Tools/FixtureGen/VerifyEdits.java /tmp/edits/edited-*

  macos:
    name: Package tests and app build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Package tests
        run: swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: App
      - name: Build app
        run: |
          xcodebuild -project App/AccessMac.xcodeproj -scheme AccessMac \
            -configuration Release -destination 'platform=macOS' \
            -derivedDataPath build \
            build | tee xcodebuild.log | grep -E '(error|warning:|BUILD)' || true
          test "${PIPESTATUS[0]}" -eq 0
      - name: Package app
        run: |
          ditto -c -k --keepParent "build/Build/Products/Release/Access for Mac.app" AccessForMac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AccessForMac
          path: AccessForMac.zip
          retention-days: 14
